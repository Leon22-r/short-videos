# One Postgres server, one database and role per domain. Paths are relative to
# this file's directory: Compose resolves an included file's relative paths
# against that file, not against the composition that includes it.
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    mem_limit: 512m
    # On both networks on purpose: it is the one resource both trust levels
    # share. The boundary between them is enforced by database privileges and
    # a per-role connection limit, not by reachability.
    networks: [heavy-net, public-net]
    environment:
      POSTGRES_DB: ${PUBLISHING_DB_NAME:-short_videos}
      POSTGRES_USER: ${PUBLISHING_DB_USER:-short_videos}
      # Required, no default. POSTGRES_USER is a superuser, and this server is
      # on public-net so the untrusted instance can reach port 5432 — a password
      # committed to git would be a superuser login anyone with the repo can read.
      POSTGRES_PASSWORD: ${PUBLISHING_DB_PASSWORD:?set PUBLISHING_DB_PASSWORD in hosts/.env}
    ports:
      - "${POSTGRES_BIND_ADDRESS:-127.0.0.1}:${PUBLISHING_DB_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    volumes:
      - publishing_db_data:/var/lib/postgresql/data
      # Only ever runs on a fresh data directory. The bootstrap service added in
      # Task 3 is what reaches an already-initialised volume.
      - ../../../domains/short-videos/postgres/init:/docker-entrypoint-initdb.d:ro

  short-videos-migrations:
    image: postgres:16-alpine
    restart: "no"
    networks: [heavy-net]
    environment:
      DATABASE_URL: postgresql://${PUBLISHING_DB_USER:-short_videos}:${PUBLISHING_DB_PASSWORD:?set PUBLISHING_DB_PASSWORD in hosts/.env}@postgres:5432/${PUBLISHING_DB_NAME:-short_videos}
    command: ["/run-migrations.sh"]
    volumes:
      - ./run-migrations.sh:/run-migrations.sh:ro
      - ../../../domains/short-videos/postgres/migrations:/migrations:ro
    depends_on:
      postgres:
        condition: service_healthy

  # Reaches an already-initialised volume, which docker-entrypoint-initdb.d
  # cannot: that only runs on an empty data directory, so whatsapp_access would
  # otherwise never be created on this server. Every statement is idempotent.
  postgres-bootstrap:
    image: postgres:16-alpine
    restart: "no"
    networks: [heavy-net]
    environment:
      POSTGRES_HOST: postgres
      ADMIN_USER: ${PUBLISHING_DB_USER:-short_videos}
      ADMIN_PASSWORD: ${PUBLISHING_DB_PASSWORD:?set PUBLISHING_DB_PASSWORD in hosts/.env}
      ADMIN_DB: ${PUBLISHING_DB_NAME:-short_videos}
      VIDEO_DB_NAME: ${PUBLISHING_DB_NAME:-short_videos}
      VIDEO_DB_USER: ${PUBLISHING_DB_USER:-short_videos}
      WHATSAPP_DB_NAME: ${WHATSAPP_DB_NAME:-whatsapp_access}
      WHATSAPP_DB_USER: ${WHATSAPP_DB_USER:-whatsapp_access}
      WHATSAPP_DB_PASSWORD: ${WHATSAPP_DB_PASSWORD:?set WHATSAPP_DB_PASSWORD in hosts/.env}
    command: ["/bootstrap-databases.sh"]
    volumes:
      - ./bootstrap-databases.sh:/bootstrap-databases.sh:ro
    depends_on:
      postgres:
        condition: service_healthy

  whatsapp-access-migrations:
    image: postgres:16-alpine
    restart: "no"
    networks: [heavy-net]
    environment:
      DATABASE_URL: postgresql://${WHATSAPP_DB_USER:-whatsapp_access}:${WHATSAPP_DB_PASSWORD:?set WHATSAPP_DB_PASSWORD in hosts/.env}@postgres:5432/${WHATSAPP_DB_NAME:-whatsapp_access}
    command: ["/run-migrations.sh"]
    volumes:
      - ./run-migrations.sh:/run-migrations.sh:ro
      # Empty today. run-migrations.sh guards each file with [ -f ], so an empty
      # directory is a no-op rather than an error.
      - ../../../domains/whatsapp-access/postgres/migrations:/migrations:ro
    depends_on:
      postgres:
        condition: service_healthy
      postgres-bootstrap:
        condition: service_completed_successfully

# Declared identically in every host file so each one also validates alone.
networks:
  heavy-net:
  public-net:

volumes:
  publishing_db_data:
    # Pinned so the real Docker volume name cannot drift with the project name.
    # Compose precedence is -p > COMPOSE_PROJECT_NAME > in-file name: > directory
    # basename, so `name: n8n` alone is beaten by a stray env var or by running
    # `docker compose -f hosts/heavy/compose.yaml` directly — either of which
    # would bind an empty volume and bring the stack up with no data.
    name: n8n_publishing_db_data
